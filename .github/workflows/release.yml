name: Build / Publish ASM Release

on:
  workflow_dispatch:
    inputs:
      release_label:
        description: Release label (for example 0.1.0-test20 or 0.1.0)
        required: true
        type: string
      publish:
        description: Publish a GitHub Release after validation
        required: true
        type: boolean
        default: false
      draft:
        description: Publish as a draft release
        required: true
        type: boolean
        default: false
      prerelease:
        description: Mark the GitHub Release as a prerelease
        required: true
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - .github/release-request.json

permissions:
  contents: write

concurrency:
  group: adaptive-smart-manager-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and verify ASM release
    runs-on: ubuntu-latest

    steps:
      - name: Check out exact release source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve release request
        id: request
        shell: pwsh
        run: |
          $manifest = Get-Content -LiteralPath './manifest.json' -Raw | ConvertFrom-Json
          $manifestVersion = [string]$manifest.version_number

          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
              $label = '${{ inputs.release_label }}'
              $publish = '${{ inputs.publish }}'
              $draft = '${{ inputs.draft }}'
              $prerelease = '${{ inputs.prerelease }}'
          }
          else {
              $request = Get-Content -LiteralPath './.github/release-request.json' -Raw | ConvertFrom-Json

              if ([string]$request.version -ne $manifestVersion) {
                  throw "Release request version '$($request.version)' does not match manifest version '$manifestVersion'."
              }

              $label = [string]$request.release_label
              $publish = ([bool]$request.publish).ToString().ToLowerInvariant()
              $draft = ([bool]$request.draft).ToString().ToLowerInvariant()
              $prerelease = ([bool]$request.prerelease).ToString().ToLowerInvariant()
          }

          if ([string]::IsNullOrWhiteSpace($label)) {
              throw 'Release label is empty.'
          }

          "release_label=$label" >> $env:GITHUB_OUTPUT
          "publish=$publish" >> $env:GITHUB_OUTPUT
          "draft=$draft" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT

      - name: Build and verify package
        shell: pwsh
        run: |
          ./tools/New-Release.ps1 -ReleaseLabel '${{ steps.request.outputs.release_label }}'

      - name: Create or repair GitHub Release
        if: steps.request.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $label = '${{ steps.request.outputs.release_label }}'
          $tag = "v$label"
          $repository = '${{ github.repository }}'
          $archiveName = "guardipee14-AdaptiveSmartManager-v$label.zip"
          $archivePath = "./release/$archiveName"
          $checksumName = "$archiveName.sha256"
          $checksumPath = "./release/$checksumName"
          $notesPath = "./release/guardipee14-AdaptiveSmartManager-v$label-release-notes.md"
          $draft = '${{ steps.request.outputs.draft }}' -eq 'true'
          $prerelease = '${{ steps.request.outputs.prerelease }}' -eq 'true'

          $existingJson = & gh release view $tag --repo $repository --json tagName,url,isDraft,isPrerelease,assets 2>$null
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
              Write-Host "Release $tag already exists. Updating metadata and repairing missing assets."

              $editArguments = @(
                  'release', 'edit', $tag,
                  '--repo', $repository,
                  '--title', "Adaptive Smart Manager v$label",
                  '--notes-file', $notesPath,
                  "--draft=$($draft.ToString().ToLowerInvariant())",
                  "--prerelease=$($prerelease.ToString().ToLowerInvariant())"
              )

              & gh @editArguments
              if ($LASTEXITCODE -ne 0) {
                  throw "Unable to update existing GitHub Release $tag."
              }

              $existing = $existingJson | ConvertFrom-Json
              $assetNames = @($existing.assets | ForEach-Object { [string]$_.name })
              $missingAssets = @()

              if ($archiveName -notin $assetNames) {
                  $missingAssets += $archivePath
              }

              if ($checksumName -notin $assetNames) {
                  $missingAssets += $checksumPath
              }

              if ($missingAssets.Count -gt 0) {
                  $uploadArguments = @('release', 'upload', $tag) + $missingAssets + @('--repo', $repository)
                  & gh @uploadArguments

                  if ($LASTEXITCODE -ne 0) {
                      throw "Unable to upload missing assets to GitHub Release $tag."
                  }
              }
              else {
                  Write-Host "Release $tag already contains both verified assets."
              }
          }
          else {
              $createArguments = @(
                  'release', 'create', $tag,
                  $archivePath,
                  $checksumPath,
                  '--repo', $repository,
                  '--target', '${{ github.sha }}',
                  '--title', "Adaptive Smart Manager v$label",
                  '--notes-file', $notesPath
              )

              if ($draft) {
                  $createArguments += '--draft'
              }

              if ($prerelease) {
                  $createArguments += '--prerelease'
              }

              & gh @createArguments
              if ($LASTEXITCODE -ne 0) {
                  throw "GitHub Release creation failed for $tag."
              }
          }

      - name: Verify requested GitHub Release
        id: published_release
        if: steps.request.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $label = '${{ steps.request.outputs.release_label }}'
          $tag = "v$label"
          $archiveName = "guardipee14-AdaptiveSmartManager-v$label.zip"
          $checksumName = "$archiveName.sha256"

          $releaseJson = & gh release view $tag --repo '${{ github.repository }}' --json tagName,url,isDraft,isPrerelease,assets
          if ($LASTEXITCODE -ne 0) {
              throw "Requested GitHub Release $tag does not exist."
          }

          $release = $releaseJson | ConvertFrom-Json
          if ([string]$release.tagName -ne $tag) {
              throw "Release tag verification failed. Expected $tag, got '$($release.tagName)'."
          }

          $assetNames = @($release.assets | ForEach-Object { [string]$_.name })
          if ($archiveName -notin $assetNames) {
              throw "GitHub Release $tag is missing ZIP asset $archiveName."
          }

          if ($checksumName -notin $assetNames) {
              throw "GitHub Release $tag is missing checksum asset $checksumName."
          }

          "release_url=$($release.url)" >> $env:GITHUB_OUTPUT
          Write-Host "Verified GitHub Release: $($release.url)"

      - name: Upload verified release bundle
        uses: actions/upload-artifact@v6
        with:
          name: adaptive-smart-manager-${{ steps.request.outputs.release_label }}-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: |
            release/*.zip
            release/*.sha256
            release/*-release-notes.md

      - name: Write release summary
        shell: pwsh
        run: |
          $label = '${{ steps.request.outputs.release_label }}'
          $archive = "guardipee14-AdaptiveSmartManager-v$label.zip"
          $checksum = Get-Content -LiteralPath "./release/$archive.sha256" -Raw
          $sha256 = $checksum.Split(' ')[0].Trim()
          $releaseUrl = '${{ steps.published_release.outputs.release_url }}'

          @"
          ## Adaptive Smart Manager v$label

          - Source commit: ``${{ github.sha }}``
          - Archive: ``$archive``
          - SHA-256: ``$sha256``
          - Publish requested: ``${{ steps.request.outputs.publish }}``
          - Draft: ``${{ steps.request.outputs.draft }}``
          - Prerelease: ``${{ steps.request.outputs.prerelease }}``
          - Release URL: ``$releaseUrl``
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
